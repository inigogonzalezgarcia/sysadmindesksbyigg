name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: No inline scripts or styles (the CSP blocks them)
        run: |
          ! grep -nE '<script>|<script [^>]*>[^<]|style="|onclick=' public/index.html
      - name: No innerHTML in the app
        run: |
          ! grep -n 'innerHTML' public/assets/*.js
