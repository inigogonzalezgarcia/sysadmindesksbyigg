name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: No inline scripts or styles (the CSP blocks them)
        # JSON-LD is data, not code: the CSP does not block it.
        run: |
          ! grep -nE '<script>|<script [^>]*>[^<]|style="|onclick=' public/index.html | grep -v 'application/ld+json'
      - name: No innerHTML in the app
        # Looks for assignments, so a comment that mentions innerHTML does not fail the check.
        run: |
          ! grep -nE '\.(innerHTML|outerHTML)\s*\+?=|insertAdjacentHTML' public/assets/*.js
